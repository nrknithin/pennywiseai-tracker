# Robolectric configuration for :app's JVM unit tests (spec 06 §6.1, "Repository / DAO tests").
#
# sdk — pinned, deliberately, instead of letting Robolectric follow `targetSdk`.
#   The gate has to mean the same thing on every machine and in CI, and a floating API level
#   silently changes both the SQLite build under Room and the amount Robolectric downloads on
#   a cold run. API 34 is inside the app's supported range (minSdk 26 … targetSdk 36) and is
#   the level Robolectric has the most shadow coverage for. Raise it on purpose, with a run,
#   never as a side effect of bumping targetSdk.
#
# application — android.app.Application rather than the manifest's FinTrackApplication.
#   The real one is @HiltAndroidApp and its onCreate() enqueues the periodic EmailSyncWorker,
#   so letting Robolectric instantiate it would drag Hilt's generated component and WorkManager
#   into tests that only want a database. These suites are about SQL; they own no application.
sdk=34
application=android.app.Application
