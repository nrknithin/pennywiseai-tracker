[versions]
agp = "9.2.1"
# JavaMail's Android port. Its package is javax.mail.*, not jakarta.mail.* — Jakarta Mail 2.x
# and angus-mail need java.beans and javax.activation, which Android does not ship.
androidMail = "1.6.7"
# Credential Manager. credentials-play-services-auth is NOT optional: the system
# Credential Manager only exists from API 34 and minSdk here is 26, so below 14 the
# request is served by Google Play services and ONLY if that artifact is present.
# Omitting it compiles cleanly and then throws NoCredentialException /
# GetCredentialProviderConfigurationException at runtime on every device under 34,
# with an error that never names the missing dependency.
androidxCredentials = "1.3.0"
googleid = "1.1.1"
appUpdate = "2.1.0"
appUpdateKtx = "2.1.0"
biometric = "1.1.0"
colorpickerCompose = "1.1.4"
coreSplashscreen = "1.2.0"
datastorePreferences = "1.2.1"
documentfile = "1.1.0"
glance = "1.1.1"
gson = "2.14.0"
hiltAndroid = "2.59.2"
hiltAndroidCompiler = "2.59.2"
hiltCompiler = "1.3.0"
hiltNavigationCompose = "1.3.0"
hiltWork = "1.3.0"
jsoup = "1.18.3"
kotlin = "2.3.21"
coreKtx = "1.18.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlinxSerializationJson = "1.11.0"
ktorVersion = "2.3.13"
lifecycleRuntimeCompose = "2.10.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
lifecycleViewmodelCompose = "2.10.0"
markdown = "0.7.3"
mockk = "1.14.9"
navVersion = "2.9.6"
opencsv = "5.12.0"
pdfboxAndroid = "2.0.27.0"
review = "2.0.2"
reviewKtx = "2.0.2"
# Robolectric — the Android runtime for JVM unit tests, which is what lets a real Room
# database (and therefore real SQL) run under `./init.sh app` instead of only on a device.
# Pinned rather than floating: this version decides which android-all jar Robolectric fetches.
robolectric = "4.17"
roomVersion = "2.8.4"
# MasterKey + EncryptedSharedPreferences for the Gmail app password (spec 04 §4.1).
# Pinned to the last alpha rather than "1.1.0": Jetpack Security Crypto was deprecated by
# Google and 1.1.0 never went stable, so naming it would break dependency resolution
# outright. alpha06 has been the de-facto release for years and is the version the design
# note lists as the fallback. Bumping is a one-line change if a stable ever ships.
securityCrypto = "1.1.0-alpha06"
# Timber, for the redacting release log tree (spec 04 §4.6, AC-11-04). 5.0.1 is the last
# release and is Kotlin-first (`Timber.Forest`); it resolves from Maven Central, which is
# an order of magnitude faster here than the Google CDNs.
timber = "5.0.1"
# litertlm >= 0.14 is compiled with -Xjvm-default=all and calls
# SendChannel.close$default as an interface static. kotlinx-coroutines only
# ships that static from 1.11.0 (built with jvm-default statics); app/build.gradle.kts
# pins coroutines-core/-android to 1.11.0 for exactly this reason. Verified on the
# emulator: chat + generation complete without the #599 NoSuchMethodError, and
# generation is ~3x faster than 0.13.1. 0.17.0 additionally needs a Hilt bump
# (Kotlin 2.4 metadata) — not done yet.
litertlm = "0.16.1"
visionInternalVkp = "18.2.3"
workVersion = "2.11.2"
coil = "2.7.0"
material3 = "1.5.0-alpha12"
haze = "1.7.1"
composeCharts = "0.2.5"
billingKtx = "9.0.0"

